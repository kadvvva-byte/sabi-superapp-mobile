name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-release-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Generate temporary release keystore
        run: |
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          echo "SABI_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "SABI_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore android/app/sabi-release.keystore \
            -alias sabi-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Sabi SuperApp, OU=Sabi, O=Sabi, L=Tashkent, S=Tashkent, C=UZ"

      - name: Configure release signing
        run: |
          node <<'NODE'
          const fs = require("fs");

          const path = "android/app/build.gradle";
          let content = fs.readFileSync(path, "utf8");

          if (!content.includes("sabiRelease {")) {
            content = content.replace(
              /(signingConfigs\s*\{[\s\S]*?debug\s*\{[\s\S]*?\n\s*\})/,
              `$1
                  sabiRelease {
                      storeFile file("sabi-release.keystore")
                      storePassword System.getenv("SABI_STORE_PASS")
                      keyAlias "sabi-release"
                      keyPassword System.getenv("SABI_KEY_PASS")
                  }`
            );
          }

          if (content.includes("signingConfig signingConfigs.debug")) {
            content = content.replace(
              /release\s*\{([\s\S]*?)signingConfig signingConfigs\.debug/,
              "release {$1signingConfig signingConfigs.sabiRelease"
            );
          } else if (!content.includes("signingConfig signingConfigs.sabiRelease")) {
            content = content.replace(
              /release\s*\{/,
              "release {\n            signingConfig signingConfigs.sabiRelease"
            );
          }

          fs.writeFileSync(path, content);
          NODE

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabi-superapp-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
