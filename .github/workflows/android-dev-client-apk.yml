name: Android Dev Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "eas.json"
      - ".github/workflows/android-dev-client-apk.yml"

jobs:
  build-dev-client-apk:
    name: Build Android Dev Client APK
    runs-on: ubuntu-latest

    env:
      NODE_ENV: development
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      EXPO_PUBLIC_API_BASE_URL: http://178.154.210.119
      EXPO_PUBLIC_AUTH_API_BASE_URL: http://178.154.210.119
      EXPO_PUBLIC_QR_API_BASE_URL: http://178.154.210.119

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build dev client APK
        run: eas build --platform android --profile development --non-interactive --wait

